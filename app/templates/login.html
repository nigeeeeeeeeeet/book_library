{% extends "base.html" %}
{% block content %}
<div class="form-page">
    <h1>Вхід</h1>
    {% if error %}<p class="error">Невірний логін або пароль</p>{% endif %}
    <form method="post" action="/login" class="form">
        <label>Логін
            <input type="text" name="login" required autofocus>
        </label>
        <label>Пароль
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn-liquid">Увійти</button>
    </form>
    <p class="hint">За замовчуванням: <code>admin</code> / <code>admin123</code></p>
</div>
{% endblock %}
